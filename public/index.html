<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JoziLift: Find it. Stop it. Ride it.</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--black:#0a0a0a;--yellow:#FFD000;--green:#00C853;--white:#f5f5f0;--grey:#17171a;--mid:#2c2c30;--muted:#9a9aa0}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--black);color:var(--white);font-family:'DM Sans',sans-serif;overflow:hidden}
  main{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px calc(env(safe-area-inset-bottom,0px) + 40px)}
  .skyline{position:absolute;bottom:0;left:0;width:100%;height:34%;opacity:.9;z-index:0;pointer-events:none}
  main>*:not(.skyline){position:relative;z-index:1}
  .eyebrow{font-size:13px;font-weight:700;color:var(--yellow);margin-bottom:14px;letter-spacing:1px}
  h1{font:400 clamp(64px,14vw,120px)/1 'Bebas Neue',sans-serif;letter-spacing:1px}
  h1 span{color:var(--yellow)}
  .tagline{font-size:clamp(16px,2.6vw,20px);color:var(--muted);margin-top:16px;max-width:520px;line-height:1.5}
  .live{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:8px 16px;border-radius:99px;border:1px solid var(--mid);background:rgba(23,23,26,.85);font-size:14px;font-weight:700}
  .live i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
  .live.on i{background:var(--green);box-shadow:0 0 0 4px rgba(0,200,83,.25)}
  .actions{display:flex;flex-direction:column;gap:12px;margin-top:28px;width:100%;max-width:340px}
  .btn{display:block;padding:18px;border-radius:14px;font:700 18px 'DM Sans',sans-serif;text-decoration:none;text-align:center}
  .btn.primary{background:var(--yellow);color:var(--black)}
  .btn.ghost{background:rgba(23,23,26,.85);color:var(--white);border:1px solid var(--mid)}
  .btn:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
</style>
</head>
<body>
<main>
  <svg class="skyline" viewBox="0 0 900 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="0" y="120" width="60" height="100" fill="#1c1c20"/><rect x="65" y="90" width="45" height="130" fill="#1c1c20"/>
    <rect x="115" y="140" width="55" height="80" fill="#17171a"/><rect x="175" y="60" width="38" height="160" fill="#1c1c20"/>
    <rect x="220" y="100" width="70" height="120" fill="#17171a"/><rect x="295" y="40" width="30" height="180" fill="#1c1c20"/>
    <rect x="330" y="130" width="60" height="90" fill="#17171a"/><rect x="395" y="20" width="42" height="200" fill="#1c1c20"/>
    <rect x="442" y="150" width="80" height="70" fill="#17171a"/><rect x="527" y="70" width="34" height="150" fill="#1c1c20"/>
    <rect x="566" y="110" width="60" height="110" fill="#17171a"/><rect x="630" y="50" width="36" height="170" fill="#1c1c20"/>
    <rect x="670" y="135" width="65" height="85" fill="#17171a"/><rect x="740" y="95" width="40" height="125" fill="#1c1c20"/>
    <rect x="785" y="150" width="55" height="70" fill="#17171a"/><rect x="845" y="80" width="35" height="140" fill="#1c1c20"/>
    <g fill="#FFD000" opacity=".55">
      <rect x="80" y="105" width="6" height="6"/><rect x="80" y="120" width="6" height="6"/>
      <rect x="230" y="115" width="6" height="6"/><rect x="250" y="130" width="6" height="6"/>
      <rect x="405" y="35" width="6" height="6"/><rect x="405" y="60" width="6" height="6"/><rect x="420" y="90" width="6" height="6"/>
      <rect x="580" y="125" width="6" height="6"/><rect x="600" y="150" width="6" height="6"/>
      <rect x="750" y="110" width="6" height="6"/><rect x="750" y="135" width="6" height="6"/>
    </g>
  </svg>
  <div class="eyebrow">JOHANNESBURG · LIVE TAXI TRACKING</div>
  <h1>Jozi<span>Lift</span></h1>
  <p class="tagline">Find it. Stop it. Ride it.<br>A simple way to connect Joburg commuters to their ride, live.</p>
  <div class="live" id="live" role="status" aria-live="polite"><i></i><span id="liveText">Checking for taxis…</span></div>
  <div class="actions">
    <a class="btn primary" href="/map.html">🗺️ Find a taxi near me</a>
    <a class="btn ghost" href="/driver.html">🚕 I'm a driver</a>
  </div>
</main>
<script>
async function check() {
  const box = document.getElementById('live'), txt = document.getElementById('liveText');
  try {
    const taxis = await (await fetch('/api/taxis', { cache: 'no-store' })).json();
    box.classList.toggle('on', taxis.length > 0);
    txt.textContent = taxis.length ? taxis.length + (taxis.length === 1 ? ' taxi live now' : ' taxis live now') : 'No taxis live right now';
  } catch (e) { box.classList.remove('on'); txt.textContent = 'Connecting…'; }
}
check(); setInterval(check, 5000);
</script>
</body>
</html>
