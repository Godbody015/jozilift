<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JoziLift Driver</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--black:#0a0a0a;--yellow:#FFD000;--green:#00C853;--red:#FF3B30;--white:#f5f5f0;--grey:#17171a;--mid:#2c2c30;--muted:#9a9aa0}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--black);color:var(--white);font-family:'DM Sans',sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:28px 24px;max-width:460px;margin:auto}
  h1{font-family:'Bebas Neue',sans-serif;font-size:56px;line-height:1;font-weight:400}
  h1 span{color:var(--yellow)}
  p{color:var(--muted);line-height:1.5}
  label{font-weight:700;font-size:14px}
  input{width:100%;margin-top:8px;padding:16px;font:700 20px 'DM Sans',sans-serif;text-transform:uppercase;background:var(--grey);color:var(--white);border:1px solid var(--mid);border-radius:12px}
  input:focus-visible,button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  button{padding:20px;font:700 20px 'DM Sans',sans-serif;border:0;border-radius:14px;background:var(--yellow);color:var(--black);cursor:pointer}
  button.stop{background:var(--red);color:#fff}
  #status{background:var(--grey);border:1px solid var(--mid);border-radius:14px;padding:16px;display:none;gap:6px;flex-direction:column}
  #status b{font-size:18px}
  .live{color:var(--green)} .bad{color:var(--red)}
</style>
</head>
<body>
<main>
  <h1>Jozi<span>Lift</span> Driver</h1>
  <p>Keep this page open and the screen on while you drive. Passengers nearby will see your taxi on their map. Tap Stop when you finish.</p>
  <div><label for="plate">Taxi number plate</label><input id="plate" autocomplete="off" maxlength="20" placeholder="e.g. CA 123 GP"></div>
  <button id="btn">Start sharing my location</button>
  <div id="status"><b id="state"></b><span id="detail"></span></div>
</main>
<script>
const $ = id => document.getElementById(id);
let watchId = null, timer = null, wake = null, last = null, sent = 0;
try { $('plate').value = localStorage.getItem('plate') || ''; } catch (e) {}

function show(text, cls, detail) {
  $('status').style.display = 'flex';
  $('state').textContent = text; $('state').className = cls || '';
  $('detail').textContent = detail || '';
}
async function send(body) {
  try { await fetch('/api/update', { method: 'POST', body: JSON.stringify(body) }); return true; }
  catch (e) { return false; }
}
async function start() {
  const id = $('plate').value.trim();
  if (!id) { $('plate').focus(); return; }
  if (!navigator.geolocation) { show('This phone cannot share location', 'bad', 'Try Chrome or Safari.'); return; }
  try { localStorage.setItem('plate', id); } catch (e) {}
  try { wake = await navigator.wakeLock.request('screen'); } catch (e) {}
  watchId = navigator.geolocation.watchPosition(
    p => { last = p; },
    e => show('Location blocked', 'bad', 'Allow location for this site in your browser settings, then tap Start again.'),
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 }
  );
  timer = setInterval(async () => {
    if (!last) { show('Finding your GPS…', '', 'Stay outside or near a window.'); return; }
    const c = last.coords;
    const ok = await send({ id, lat: c.latitude, lng: c.longitude, sp: c.speed });
    if (ok) sent++;
    show(ok ? 'Live: passengers can see you' : 'No signal, retrying…', ok ? 'live' : 'bad',
      `GPS accuracy ±${Math.round(c.accuracy)} m · Updates sent: ${sent}`);
  }, 4000);
  $('btn').textContent = 'Stop sharing'; $('btn').className = 'stop'; $('plate').disabled = true;
}
async function stop() {
  navigator.geolocation.clearWatch(watchId); clearInterval(timer);
  if (wake) wake.release().catch(() => {});
  await send({ id: $('plate').value.trim(), stop: true });
  $('btn').textContent = 'Start sharing my location'; $('btn').className = ''; $('plate').disabled = false;
  show('Stopped', '', 'You are no longer visible to passengers.');
  watchId = null; last = null; sent = 0;
}
$('btn').addEventListener('click', () => watchId === null ? start() : stop());
document.addEventListener('visibilitychange', async () => {
  if (watchId !== null && document.visibilityState === 'visible') {
    try { wake = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
});
</script>
</body>
</html>
