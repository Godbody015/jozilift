<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JoziLift Map: Find it. Stop it. Ride it.</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--black:#0a0a0a;--yellow:#FFD000;--green:#00C853;--white:#f5f5f0;--grey:#17171a;--mid:#2c2c30;--muted:#9a9aa0}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--black);color:var(--white);font-family:'DM Sans',sans-serif;overflow:hidden}
  #map{position:absolute;inset:0;background:#0f0f11}
  /* Brand-tuned dark map: warm-tinted roads on near-black, instead of flat grey */
  .leaflet-tile-pane{filter:invert(1) hue-rotate(195deg) saturate(.45) brightness(.78) contrast(1.15) sepia(.35)}
  .leaflet-container{font-family:'DM Sans',sans-serif;cursor:grab}
  /* Soft vignette so UI floats over the map like the home page skyline */
  .fade{position:absolute;left:0;right:0;z-index:400;pointer-events:none}
  .fade.top{top:0;height:130px;background:linear-gradient(rgba(10,10,10,.9),transparent)}
  .fade.bot{bottom:0;height:300px;background:linear-gradient(transparent,rgba(10,10,10,.92))}
  .brand{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;z-index:500;font:28px 'Bebas Neue',sans-serif;background:rgba(10,10,10,.85);padding:4px 14px;border-radius:99px;border:1px solid var(--mid);color:var(--white);text-decoration:none}
  .brand span{color:var(--yellow)}
  .driverbtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;z-index:500;background:var(--yellow);color:var(--black);font-weight:700;font-size:14px;padding:10px 16px;border-radius:99px;text-decoration:none}
  .fabs{position:absolute;right:14px;top:50%;transform:translateY(-50%);z-index:500;display:flex;flex-direction:column;gap:10px}
  .fab{width:48px;height:48px;border-radius:50%;border:1px solid var(--mid);background:rgba(23,23,26,.92);color:var(--white);font-size:20px;cursor:pointer}
  .fab.on{background:var(--yellow);color:var(--black);border-color:var(--yellow)}
  .fab:focus-visible,.row:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  .sheet{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:500;max-width:460px;margin:auto;background:rgba(23,23,26,.96);border:1px solid var(--mid);border-radius:20px;padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .handle{width:36px;height:4px;border-radius:2px;background:var(--mid);margin:-4px auto 10px}
  #title{font-weight:700;font-size:20px}
  #sub{color:var(--muted);margin-top:4px;font-size:15px}
  #list{margin-top:10px;max-height:26vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
  #list:empty{display:none}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:12px 14px;border:1px solid var(--mid);border-radius:12px;background:var(--black);color:var(--white);font:700 15px 'DM Sans',sans-serif;cursor:pointer;text-align:left}
  .row small{color:var(--muted);font-weight:500}
  .row.first{border-color:var(--yellow)}
  /* Markers */
  .taxi{position:relative;width:38px;height:38px;border-radius:50%;background:var(--yellow);border:3px solid var(--black);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 12px rgba(0,0,0,.6)}
  .taxi::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--yellow);animation:pulse 2s ease-out infinite}
  .near .taxi{box-shadow:0 0 0 6px rgba(255,208,0,.25),0 4px 14px rgba(0,0,0,.6)}
  .tag{display:none;position:absolute;top:-24px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--black);color:var(--yellow);font:700 11px 'DM Sans',sans-serif;padding:2px 8px;border-radius:99px;border:1px solid var(--mid)}
  @keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.9);opacity:0}}
  .me{width:18px;height:18px;border-radius:50%;background:var(--green);border:3px solid var(--black);box-shadow:0 0 0 8px rgba(0,200,83,.25)}
  .pinwrap{width:30px;height:34px}
  .pin{width:28px;height:28px;background:var(--yellow);border:3px solid var(--black);border-radius:50% 50% 50% 0;transform:rotate(-45deg);margin:0 1px;box-shadow:0 4px 10px rgba(0,0,0,.6)}
  .pin::after{content:'';display:block;width:8px;height:8px;background:var(--black);border-radius:50%;margin:7px}
  .leaflet-control-attribution{background:rgba(10,10,10,.7)!important;color:var(--muted)!important}
  .leaflet-control-attribution a{color:var(--muted)!important}
  /* Smooth gliding taxis (like Bolt) instead of jumping every 3s */
  .leaflet-marker-icon{transition:transform 3s linear}
  .nomove .leaflet-marker-icon{transition:none!important}
  .taxi::before{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--yellow);animation:pulse 2s ease-out 1s infinite}
  /* BIG VIEW: larger, higher contrast, easier to see */
  body.big .leaflet-tile-pane{filter:invert(1) hue-rotate(195deg) saturate(.3) brightness(1.15) contrast(1.5)}
  body.big .taxi{transform:scale(1.7);border-color:#fff;border-width:4px;box-shadow:0 0 0 5px #000,0 0 22px 6px rgba(255,208,0,.8)}
  body.big .me{transform:scale(1.8)}
  body.big .pinwrap{transform:scale(1.7);transform-origin:50% 100%}
  body.big .tag{font-size:15px;top:-34px;padding:4px 12px;color:#000;background:var(--yellow);border-color:#000}
  body.big #title{font-size:28px}
  body.big #sub{font-size:19px;color:var(--white);line-height:1.4}
  body.big .row{font-size:19px;padding:16px}
  body.big .row small{color:var(--white);font-size:16px}
  body.big .fab{width:60px;height:60px;font-size:26px;border-width:2px;border-color:var(--white)}
  body.big .brand,body.big .driverbtn{font-size:inherit}
  body.big .driverbtn{font-size:17px;padding:12px 18px}
  body.big .leaflet-control-attribution{font-size:11px}
  @media (prefers-reduced-motion:reduce){.taxi::after,.taxi::before{animation:none}.leaflet-marker-icon{transition:none}}
</style>
</head>
<body>
<div id="map"></div>
<div class="fade top"></div><div class="fade bot"></div>
<a class="brand" href="/" aria-label="JoziLift home">Jozi<span>Lift</span></a>
<a class="driverbtn" href="/driver.html">I'm a driver 🚕</a>
<div class="fabs">
  <button class="fab" id="bMe" aria-label="Centre on my location">📍</button>
  <button class="fab" id="bAll" aria-label="Show all taxis">🌍</button>
  <button class="fab" id="bPin" aria-label="Drop a pickup pin">📌</button>
  <button class="fab" id="bBig" aria-label="Toggle big high-contrast view" aria-pressed="true">👁️</button>
  <button class="fab" id="bSay" aria-label="Read out nearest taxi">🔊</button>
</div>
<div class="sheet" role="status" aria-live="polite">
  <div class="handle"></div>
  <div id="title">Looking for taxis…</div>
  <div id="sub">Allow location so we can show what's near you.</div>
  <div id="list"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map', { zoomControl: false }).setView([-26.2041, 28.0473], 13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);

const $ = id => document.getElementById(id);
const meIcon = L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
const pinIcon = L.divIcon({ className: '', html: '<div class="pinwrap"><div class="pin"></div></div>', iconSize: [30, 34], iconAnchor: [15, 34] });
const taxiIcon = L.divIcon({ className: '', html: '<div class="taxi">🚕<span class="tag"></span></div>', iconSize: [38, 38], iconAnchor: [19, 19] });

let me = null, meMarker = null, pin = null, pinMarker = null, pinMode = false, fitted = false, taxis = [];
const markers = new Map();
const line = L.polyline([], { color: '#FFD000', weight: 3, dashArray: '2 8', lineCap: 'round', opacity: .9 }).addTo(map);

const metres = (a, b) => {
  const R = 6371000, r = x => x * Math.PI / 180, dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};
const fmt = m => m < 1000 ? Math.round(m / 10) * 10 + ' m' : (m / 1000).toFixed(1) + ' km';
const eta = m => Math.max(1, Math.round(m / (25000 / 60))) + ' min'; // rough estimate at ~25 km/h

if (navigator.geolocation) {
  navigator.geolocation.watchPosition(p => {
    me = { lat: p.coords.latitude, lng: p.coords.longitude };
    if (!meMarker) meMarker = L.marker(me, { icon: meIcon, zIndexOffset: 1000 }).addTo(map); else meMarker.setLatLng(me);
    render();
  }, () => { $('sub').textContent = 'Location is blocked. Allow it in your browser settings to see distances.'; },
  { enableHighAccuracy: true, maximumAge: 3000 });
}

$('bMe').onclick = () => me ? map.flyTo([me.lat, me.lng], 16) : ($('sub').textContent = 'Waiting for your location…');
$('bAll').onclick = () => fit(true);

// Big view: ON by default, remembered between visits
function setBig(on) {
  document.body.classList.toggle('big', on);
  $('bBig').classList.toggle('on', on); $('bBig').setAttribute('aria-pressed', on);
  line.setStyle({ weight: on ? 6 : 3, dashArray: on ? '1 12' : '2 8' });
  try { localStorage.setItem('bigView', on ? '1' : '0'); } catch (e) {}
}
let startBig = true; try { startBig = localStorage.getItem('bigView') !== '0'; } catch (e) {}
setBig(startBig);
$('bBig').onclick = () => setBig(!document.body.classList.contains('big'));

// Voice: reads the nearest taxi out loud
$('bSay').onclick = () => {
  if (!('speechSynthesis' in window)) { $('sub').textContent = 'Voice is not supported on this device.'; return; }
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance($('title').textContent + '. ' + $('sub').textContent));
};

// Stop taxis gliding while the map zooms
map.on('zoomstart', () => document.body.classList.add('nomove'));
map.on('zoomend', () => setTimeout(() => document.body.classList.remove('nomove'), 150));
$('bPin').onclick = () => {
  if (pin) { pin = null; map.removeLayer(pinMarker); pinMarker = null; $('bPin').classList.remove('on'); render(); return; }
  pinMode = !pinMode; $('bPin').classList.toggle('on', pinMode);
  if (pinMode) $('sub').textContent = 'Tap the map where you want to be picked up.';
};
map.on('click', e => {
  if (!pinMode) return;
  pin = { lat: e.latlng.lat, lng: e.latlng.lng }; pinMode = false;
  pinMarker = L.marker(pin, { icon: pinIcon, zIndexOffset: 900 }).addTo(map);
  render();
});

function fit(force) {
  const pts = taxis.map(t => [t.lat, t.lng]);
  if (me) pts.push([me.lat, me.lng]);
  if (pin) pts.push([pin.lat, pin.lng]);
  if (pts.length && (force || !fitted)) { map.fitBounds(pts, { padding: [90, 90], maxZoom: 16 }); fitted = true; }
}

function render() {
  const target = pin || me, label = pin ? 'your pickup pin' : 'you';
  const list = taxis.map(t => ({ ...t, d: target ? metres(target, t) : null }));
  if (target) list.sort((a, b) => a.d - b.d);
  const near = target && list.length ? list[0] : null;

  for (const [id, m] of markers) {
    const el = m.getElement(); if (!el) continue;
    const isNear = !!near && near.id === id;
    el.classList.toggle('near', isNear);
    const tag = el.querySelector('.tag');
    if (tag) { tag.textContent = isNear ? fmt(near.d) : ''; tag.style.display = isNear ? 'block' : 'none'; }
  }
  line.setLatLngs(near ? [[near.lat, near.lng], [target.lat, target.lng]] : []);

  $('title').textContent = list.length ? list.length + (list.length === 1 ? ' taxi live' : ' taxis live') : 'No taxis live right now';
  $('sub').textContent = !list.length ? 'This updates on its own when a driver starts sharing.'
    : near ? 'Nearest is ' + fmt(near.d) + ' from ' + label + ' · about ' + eta(near.d) + ' (estimate)'
    : 'Allow location to see how far they are.';

  const box = $('list'); box.replaceChildren();
  list.forEach((t, i) => {
    const b = document.createElement('button'); b.className = 'row' + (i === 0 && near ? ' first' : '');
    const name = document.createElement('span'); name.textContent = '🚕 ' + t.id;
    const info = document.createElement('small');
    info.textContent = (t.d != null ? fmt(t.d) + ' · ' : '') + Math.max(0, Math.round((t.age || 0) / 1000)) + 's ago';
    b.append(name, info); b.onclick = () => map.flyTo([t.lat, t.lng], 17); box.append(b);
  });
}

async function poll() {
  try {
    taxis = await (await fetch('/api/taxis', { cache: 'no-store' })).json();
    const seen = new Set();
    for (const t of taxis) {
      seen.add(t.id);
      if (markers.has(t.id)) markers.get(t.id).setLatLng([t.lat, t.lng]);
      else markers.set(t.id, L.marker([t.lat, t.lng], { icon: taxiIcon }).addTo(map));
    }
    for (const [id, m] of markers) if (!seen.has(id)) { map.removeLayer(m); markers.delete(id); }
    render(); fit(false);
  } catch (e) { $('sub').textContent = 'Connection lost. Retrying…'; }
}
poll(); setInterval(poll, 3000);
</script>
</body>
</html>
